# Proof-of-concept: build Netty's native modules in the PyPA manylinux2014 image
# (CentOS 7 base, glibc 2.17 floor, maintained GCC 10) as a candidate replacement
# for the hand-patched, EOL Dockerfile.centos7. Isolated from the main matrix so
# it is easy to read and to remove.
name: Build project on manylinux2014 (PoC)

on:
  push:
    branches: [ "4.2" ]

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

env:
  MAVEN_OPTS: -Xmx6g -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryhandler.count=5 -Dmaven.wagon.httpconnectionManager.ttlSeconds=240

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-manylinux2014:
    # GitHub-hosted x86_64 runner — the x86_64 manylinux2014 image builds natively.
    runs-on: ubuntu-22.04
    name: linux-x86_64-manylinux2014-native
    steps:
      - uses: actions/checkout@v4

      - name: Cache local Maven repository
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.m2/repository
          key: cache-maven-manylinux2014-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            cache-maven-manylinux2014-

      - name: Build docker image
        run: docker compose -f docker/docker-compose.manylinux2014.yaml build

      - name: Build codec-native-quic (BoringSSL + quiche + JNI at glibc 2.17)
        run: docker compose -f docker/docker-compose.manylinux2014.yaml run build-native-quic

      - name: print JVM thread dumps when cancelled
        uses: ./.github/actions/thread-dump-jvms
        if: ${{ cancelled() }}
